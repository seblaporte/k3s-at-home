---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-external-values
  namespace: networking
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: crowdsec-external-values
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        value: '{{ .crowdsec_enroll_key }}'
  data:
    - secretKey: crowdsec_enroll_key
      remoteRef:
        key: crowdsec-enroll-key
