# Two static sites built by the CI of home-assistant-config (branch `site`), pulled by git-sync:
#   8080 → admin/ (full site: specs, admins only)
#   8081 → guide/ (household guide only)
server {
    listen 8080;
    root /git/current/admin;
    index index.html;
    error_page 404 /404.html;
}

server {
    listen 8081;
    root /git/current/guide;
    index index.html;
    error_page 404 /404.html;
}
