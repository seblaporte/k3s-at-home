---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: slskd
  namespace: slskd
spec:
  sourcePVC: slskd-app
  trigger:
    schedule: "30 2 * * *"
  restic:
    repository: slskd-volsync-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: synology-snapshotclass
    pruneIntervalDays: 14
    retain:
      daily: 7
      weekly: 4
      monthly: 3
