---
# Read-only deploy key of seblaporte/home-assistant-config, the one already used by the git-sync
# sidecar of Home Assistant. Only the key is copied here (not the Home Assistant token).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-docs-git-sync
  namespace: home-assistant-docs
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: home-assistant-docs-git-sync
  data:
    - secretKey: ssh-key
      remoteRef:
        key: home-assistant-git-deploy-key
