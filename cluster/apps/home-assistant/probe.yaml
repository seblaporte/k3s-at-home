---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 60s
  scrapeTimeout: 15s
  module: http_app
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      labels:
        check: web-app
      static:
        - http://home-assistant.home-assistant.svc.cluster.local:80/
