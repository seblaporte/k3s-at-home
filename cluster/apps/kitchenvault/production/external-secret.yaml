---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kitchenvault-secrets
  namespace: kitchenvault
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: kitchenvault-secrets
  data:
    - secretKey: postgres-user-password
      remoteRef:
        key: kitchenvault-production-postgres-user-password
    - secretKey: ovh-ai-endpoints-access-token
      remoteRef:
        key: kitchenvault-production-ovh-ai-endpoints-access-token
    - secretKey: COOKIDOO_EMAIL
      remoteRef:
        key: kitchenvault-production-cookidoo-email
    - secretKey: COOKIDOO_PASSWORD
      remoteRef:
        key: kitchenvault-production-cookidoo-password
