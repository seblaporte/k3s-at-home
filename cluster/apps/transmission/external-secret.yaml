---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: transmission-external-values
  namespace: transmission
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: transmission-external-values
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        OPENVPN_USER: '{{ .vpn_username }}'
        OPENVPN_PASSWORD: '{{ .vpn_password }}'
  data:
    - secretKey: vpn_password
      remoteRef:
        key: vpn-password
    - secretKey: vpn_username
      remoteRef:
        key: vpn-username
