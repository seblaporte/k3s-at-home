---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto-secure-secrets
  namespace: mosquitto
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: mosquitto-secure-secrets
  data:
    - secretKey: MQTT_USERNAME
      remoteRef:
        key: mosquitto-mqtt-username
    - secretKey: MQTT_PASSWORD
      remoteRef:
        key: mosquitto-mqtt-password
