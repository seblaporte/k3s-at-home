---
# One-shot migration to Bitwarden Secrets Manager: see doc/secrets-migration.md
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: migrate-cluster-secrets
  namespace: flux-system
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists # never overwrite a value already in Bitwarden
  deletionPolicy: None # removing this PushSecret keeps the Bitwarden secrets
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: cluster-secrets
  data:
    - match:
        secretKey: SECRET_BITWARDEN_DATABASE_URL
        remoteRef:
          remoteKey: vaultwarden-database-url
    - match:
        secretKey: SECRET_GRAFANA_ADMIN_USERNAME
        remoteRef:
          remoteKey: grafana-admin-username
    - match:
        secretKey: SECRET_GRAFANA_ADMIN_PASSWORD
        remoteRef:
          remoteKey: grafana-admin-password
    - match:
        secretKey: SECRET_TESLAMATE_DB_PASSWORD
        remoteRef:
          remoteKey: teslamate-db-password
    - match:
        secretKey: SECRET_TESLAMATE_ENCRYPTION_KEY
        remoteRef:
          remoteKey: teslamate-encryption-key
    - match:
        secretKey: SECRET_DEFAULT_USER_INFLUX_DB_PASSWORD
        remoteRef:
          remoteKey: default-user-influx-db-password
    - match:
        secretKey: SECRET_TYDOM_PASSWORD
        remoteRef:
          remoteKey: tydom-password
    - match:
        secretKey: SECRET_CROWDSEC_ENROLL_KEY
        remoteRef:
          remoteKey: crowdsec-enroll-key
    - match:
        secretKey: SECRET_RESTIC_OS_AUTH_URL
        remoteRef:
          remoteKey: restic-os-auth-url
    - match:
        secretKey: SECRET_RESTIC_OS_IDENTITY_API_VERSION
        remoteRef:
          remoteKey: restic-os-identity-api-version
    - match:
        secretKey: SECRET_RESTIC_OS_TENANT_ID
        remoteRef:
          remoteKey: restic-os-tenant-id
    - match:
        secretKey: SECRET_RESTIC_OS_TENANT_NAME
        remoteRef:
          remoteKey: restic-os-tenant-name
    - match:
        secretKey: SECRET_RESTIC_OS_USERNAME
        remoteRef:
          remoteKey: restic-os-username
    - match:
        secretKey: SECRET_RESTIC_OS_PASSWORD
        remoteRef:
          remoteKey: restic-os-password
    - match:
        secretKey: SECRET_RESTIC_OS_REGION_NAME
        remoteRef:
          remoteKey: restic-os-region-name
    - match:
        secretKey: SECRET_RESTIC_PASSWORD
        remoteRef:
          remoteKey: restic-password
    - match:
        secretKey: SECRET_RESTIC_REPOSITORY
        remoteRef:
          remoteKey: restic-repository
    - match:
        secretKey: SECRET_HOME_ASSISTANT_DB_PASSWORD
        remoteRef:
          remoteKey: home-assistant-db-password
    - match:
        secretKey: SECRET_BITWARDEN_DB_PASSWORD
        remoteRef:
          remoteKey: vaultwarden-db-password
    - match:
        secretKey: SECRET_MEMOS_DB_PASSWORD
        remoteRef:
          remoteKey: memos-db-password
    - match:
        secretKey: SECRET_JOAL_TOKEN
        remoteRef:
          remoteKey: joal-token
    - match:
        secretKey: SECRET_VPN_USERNAME
        remoteRef:
          remoteKey: vpn-username
    - match:
        secretKey: SECRET_VPN_PASSWORD
        remoteRef:
          remoteKey: vpn-password
    - match:
        secretKey: SECRET_UNPOLLER_PASSWORD
        remoteRef:
          remoteKey: unpoller-password
    - match:
        secretKey: SECRET_SONARR_DB_PASSWORD
        remoteRef:
          remoteKey: sonarr-db-password
    - match:
        secretKey: SECRET_RADARR_DB_PASSWORD
        remoteRef:
          remoteKey: radarr-db-password
    - match:
        secretKey: SECRET_PROWLARR_DB_PASSWORD
        remoteRef:
          remoteKey: prowlarr-db-password
    - match:
        secretKey: SECRET_K3S_DB_PASSWORD
        remoteRef:
          remoteKey: k3s-db-password
    - match:
        secretKey: SECRET_NAVIDROME_LASTFM_APIKEY
        remoteRef:
          remoteKey: navidrome-lastfm-apikey
    - match:
        secretKey: SECRET_NAVIDROME_LASTFM_SECRET
        remoteRef:
          remoteKey: navidrome-lastfm-secret
    - match:
        secretKey: SECRET_NAVIDROME_SPOTIFY_ID
        remoteRef:
          remoteKey: navidrome-spotify-id
    - match:
        secretKey: SECRET_NAVIDROME_SPOTIFY_SECRET
        remoteRef:
          remoteKey: navidrome-spotify-secret
    - match:
        secretKey: SECRET_UPTIME_KUMA_ADMIN_EMAIL
        remoteRef:
          remoteKey: uptime-kuma-admin-email
    - match:
        secretKey: SECRET_UPTIME_KUMA_ADMIN_PASSWORD
        remoteRef:
          remoteKey: uptime-kuma-admin-password
    - match:
        secretKey: SECRET_MINIO_ROOT_USER
        remoteRef:
          remoteKey: minio-root-user
    - match:
        secretKey: SECRET_MINIO_ROOT_PASSWORD
        remoteRef:
          remoteKey: minio-root-password
    - match:
        secretKey: SECRET_LOKI_S3_ACCESS_KEY
        remoteRef:
          remoteKey: loki-s3-access-key
    - match:
        secretKey: SECRET_LOKI_S3_SECRET_KEY
        remoteRef:
          remoteKey: loki-s3-secret-key
    - match:
        secretKey: SECRET_GHCR_PULL_TOKEN
        remoteRef:
          remoteKey: ghcr-pull-token
    - match:
        secretKey: SECRET_GHCR_USERNAME
        remoteRef:
          remoteKey: ghcr-username
    - match:
        secretKey: SECRET_ALERTMANAGER_TELEGRAM_BOT_TOKEN
        remoteRef:
          remoteKey: alertmanager-telegram-bot-token
    - match:
        secretKey: SECRET_ALERTMANAGER_TELEGRAM_CHAT_ID
        remoteRef:
          remoteKey: alertmanager-telegram-chat-id
    - match:
        secretKey: SECRET_WATCHDOG_HEALTH_CHECK_UUID
        remoteRef:
          remoteKey: watchdog-health-check-uuid
