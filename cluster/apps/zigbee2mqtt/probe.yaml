---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: zigbee2mqtt
  namespace: zigbee2mqtt
spec:
  interval: 60s
  scrapeTimeout: 15s
  module: http_app
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      labels:
        check: web-app
      static:
        - http://zigbee2mqtt.zigbee2mqtt.svc.cluster.local:8080/
