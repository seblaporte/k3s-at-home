---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: go2rtc-secrets
  namespace: go2rtc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: go2rtc-secrets
  data:
    - secretKey: NVR_USERNAME
      remoteRef:
        key: go2rtc-nvr-username
    - secretKey: NVR_PASSWORD
      remoteRef:
        key: go2rtc-nvr-password
    - secretKey: GO2RTC_USERNAME
      remoteRef:
        key: go2rtc-username
    - secretKey: GO2RTC_PASSWORD
      remoteRef:
        key: go2rtc-password
