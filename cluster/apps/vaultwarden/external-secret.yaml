---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-external-values
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: vaultwarden-external-values
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        DATABASE_URL: '{{ .vaultwarden_database_url }}'
  data:
    - secretKey: vaultwarden_database_url
      remoteRef:
        key: vaultwarden-database-url
