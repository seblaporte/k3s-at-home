---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: networking
data:
  config.yaml: |
    tunnel: c05a109a-27dc-4815-9e91-a72da43073b9
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    ingress:
      - hostname: "slskd.${SECRET_APEX_DOMAIN}"
        originRequest:
          matchSNItoHost: true
        service: https://traefik.networking.svc.cluster.local:443
      - hostname: "uptime-kuma.${SECRET_APEX_DOMAIN}"
        originRequest:
          matchSNItoHost: true
        service: https://traefik.networking.svc.cluster.local:443
      - hostname: "*.${SECRET_DOMAIN}"
        originRequest:
          noTLSVerify: true
        service: https://traefik.networking.svc.cluster.local:443
      - service: http_status:404
