apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # renovate: registryUrl=https://github.com/kubernetes-csi/external-snapshotter
  - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.4.0/deploy/kubernetes/snapshot-controller/rbac-snapshot-controller.yaml
  - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.4.0/deploy/kubernetes/snapshot-controller/setup-snapshot-controller.yaml
images:
  # The v8.4.0 manifest above still pins v8.2.1: bump to match the v8.4.0 CRDs,
  # which introduced a sourceVolumeMode transition rule that v8.2.1 doesn't satisfy
  # (causes "sourceVolumeMode is required once set" errors on every snapshot).
  - name: registry.k8s.io/sig-storage/snapshot-controller
    newTag: v8.4.0
