---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: crds
  path: ./cluster/core
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-gpg
  postBuild:
    # Upstream grafana.com dashboards reference their datasource as ${DS_PROMETHEUS}: resolve it
    # to the uid of the Prometheus datasource so the dashboard JSON can stay unmodified.
    substitute:
      DS_PROMETHEUS: prometheus
      DS_UNIFI_POLLER: prometheus
      DS_WATCHERS: prometheus
      VAR_REPLICATIONDESTNAME: ".*-dst|.*-bootstrap"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
