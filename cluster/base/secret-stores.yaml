---
# Secret stores live in their own layer: their kinds are validated by the ESO webhook,
# which only exists once the `core` HelmRelease is running. Keeping them out of `core`
# means a first install (or an ESO outage) never blocks the rest of `core`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secret-stores
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 1m0s
  dependsOn:
    - name: core
  path: ./cluster/secret-stores
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
