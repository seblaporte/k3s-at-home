---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-credentials
  namespace: restic
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: restic-credentials
    template:
      # Keys below override the raw values; every other key is copied as is.
      mergePolicy: Merge
      data:
        # These two values carry literal quotes (a Flux substitution trick in cluster-secrets)
        restic_os_identity_api_version: >-
          {{ .restic_os_identity_api_version | trimAll "\"'" }}
        restic_os_tenant_name: >-
          {{ .restic_os_tenant_name | trimAll "\"'" }}
  data:
    - secretKey: home_assistant_db_password
      remoteRef:
        key: home-assistant-db-password
    - secretKey: k3s_db_password
      remoteRef:
        key: k3s-db-password
    - secretKey: prowlarr_db_password
      remoteRef:
        key: prowlarr-db-password
    - secretKey: radarr_db_password
      remoteRef:
        key: radarr-db-password
    - secretKey: restic_os_auth_url
      remoteRef:
        key: restic-os-auth-url
    - secretKey: restic_os_identity_api_version
      remoteRef:
        key: restic-os-identity-api-version
    - secretKey: restic_os_password
      remoteRef:
        key: restic-os-password
    - secretKey: restic_os_region_name
      remoteRef:
        key: restic-os-region-name
    - secretKey: restic_os_tenant_id
      remoteRef:
        key: restic-os-tenant-id
    - secretKey: restic_os_tenant_name
      remoteRef:
        key: restic-os-tenant-name
    - secretKey: restic_os_username
      remoteRef:
        key: restic-os-username
    - secretKey: restic_password
      remoteRef:
        key: restic-password
    - secretKey: restic_repository
      remoteRef:
        key: restic-repository
    - secretKey: sonarr_db_password
      remoteRef:
        key: sonarr-db-password
    - secretKey: teslamate_db_password
      remoteRef:
        key: teslamate-db-password
    - secretKey: vaultwarden_db_password
      remoteRef:
        key: vaultwarden-db-password
