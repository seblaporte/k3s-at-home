---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tydom2mqtt-external-values
  namespace: tydom2mqtt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: tydom2mqtt-external-values
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        TYDOM_PASSWORD: '{{ .tydom_password }}'
  data:
    - secretKey: tydom_password
      remoteRef:
        key: tydom-password
