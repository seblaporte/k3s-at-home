---
# ESPHome secrets.yaml, rebuilt from one Bitwarden secret per value:
#   esphome-<key>        real secrets (Wi-Fi, API keys, OTA passwords, MAC)
#   esphome-label-<key>  household labels kept out of this public repo (not secrets)
# Add a value: create the Bitwarden secret, then add it to `data` and to the template.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: esphome-secrets
  namespace: esphome
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: esphome-secrets
    template:
      type: Opaque
      data:
        # toJson: a JSON string is a valid YAML double-quoted scalar (any character is escaped)
        secrets.yaml: |
          bluetooth_bridge_api_key: {{ .bluetooth_bridge_api_key | toJson }}
          bluetooth_bridge_ota_password: {{ .bluetooth_bridge_ota_password | toJson }}
          detecteur_presence_bureau_api_key: {{ .detecteur_presence_bureau_api_key | toJson }}
          detecteur_presence_bureau_ota_password: {{ .detecteur_presence_bureau_ota_password | toJson }}
          dinos_api_key: {{ .dinos_api_key | toJson }}
          dinos_ota_password: {{ .dinos_ota_password | toJson }}
          emporia_circuit_1: {{ .emporia_circuit_1 | toJson }}
          emporia_circuit_2: {{ .emporia_circuit_2 | toJson }}
          emporia_circuit_3: {{ .emporia_circuit_3 | toJson }}
          emporia_circuit_4: {{ .emporia_circuit_4 | toJson }}
          emporia_circuit_5: {{ .emporia_circuit_5 | toJson }}
          emporia_circuit_6: {{ .emporia_circuit_6 | toJson }}
          emporia_circuit_7: {{ .emporia_circuit_7 | toJson }}
          emporia_vue_api_key: {{ .emporia_vue_api_key | toJson }}
          emporia_vue_ota_password: {{ .emporia_vue_ota_password | toJson }}
          home_bridge_api_key: {{ .home_bridge_api_key | toJson }}
          home_bridge_input_1_name: {{ .home_bridge_input_1_name | toJson }}
          home_bridge_input_2_name: {{ .home_bridge_input_2_name | toJson }}
          home_bridge_ota_password: {{ .home_bridge_ota_password | toJson }}
          home_bridge_relay_1_name: {{ .home_bridge_relay_1_name | toJson }}
          home_bridge_relay_2_name: {{ .home_bridge_relay_2_name | toJson }}
          inmotion_wheel_mac: {{ .inmotion_wheel_mac | toJson }}
          lecteur_cartes_musique_api_key: {{ .lecteur_cartes_musique_api_key | toJson }}
          lecteur_cartes_musique_etage_api_key: {{ .lecteur_cartes_musique_etage_api_key | toJson }}
          lecteur_cartes_musique_etage_ota_password: {{ .lecteur_cartes_musique_etage_ota_password | toJson }}
          lecteur_cartes_musique_ota_password: {{ .lecteur_cartes_musique_ota_password | toJson }}
          veilleuse_etoile_api_key: {{ .veilleuse_etoile_api_key | toJson }}
          veilleuse_etoile_ota_password: {{ .veilleuse_etoile_ota_password | toJson }}
          ventilateur_cluster_k3s_api_key: {{ .ventilateur_cluster_k3s_api_key | toJson }}
          ventilateur_cluster_k3s_ota_password: {{ .ventilateur_cluster_k3s_ota_password | toJson }}
          wifi_hotspot_fallback_password: {{ .wifi_hotspot_fallback_password | toJson }}
          wifi_password: {{ .wifi_password | toJson }}
          wifi_ssid: {{ .wifi_ssid | toJson }}
  data:
    - secretKey: bluetooth_bridge_api_key
      remoteRef:
        key: esphome-bluetooth-bridge-api-key
    - secretKey: bluetooth_bridge_ota_password
      remoteRef:
        key: esphome-bluetooth-bridge-ota-password
    - secretKey: detecteur_presence_bureau_api_key
      remoteRef:
        key: esphome-detecteur-presence-bureau-api-key
    - secretKey: detecteur_presence_bureau_ota_password
      remoteRef:
        key: esphome-detecteur-presence-bureau-ota-password
    - secretKey: dinos_api_key
      remoteRef:
        key: esphome-dinos-api-key
    - secretKey: dinos_ota_password
      remoteRef:
        key: esphome-dinos-ota-password
    - secretKey: emporia_circuit_1
      remoteRef:
        key: esphome-label-emporia-circuit-1
    - secretKey: emporia_circuit_2
      remoteRef:
        key: esphome-label-emporia-circuit-2
    - secretKey: emporia_circuit_3
      remoteRef:
        key: esphome-label-emporia-circuit-3
    - secretKey: emporia_circuit_4
      remoteRef:
        key: esphome-label-emporia-circuit-4
    - secretKey: emporia_circuit_5
      remoteRef:
        key: esphome-label-emporia-circuit-5
    - secretKey: emporia_circuit_6
      remoteRef:
        key: esphome-label-emporia-circuit-6
    - secretKey: emporia_circuit_7
      remoteRef:
        key: esphome-label-emporia-circuit-7
    - secretKey: emporia_vue_api_key
      remoteRef:
        key: esphome-emporia-vue-api-key
    - secretKey: emporia_vue_ota_password
      remoteRef:
        key: esphome-emporia-vue-ota-password
    - secretKey: home_bridge_api_key
      remoteRef:
        key: esphome-home-bridge-api-key
    - secretKey: home_bridge_input_1_name
      remoteRef:
        key: esphome-label-home-bridge-input-1-name
    - secretKey: home_bridge_input_2_name
      remoteRef:
        key: esphome-label-home-bridge-input-2-name
    - secretKey: home_bridge_ota_password
      remoteRef:
        key: esphome-home-bridge-ota-password
    - secretKey: home_bridge_relay_1_name
      remoteRef:
        key: esphome-label-home-bridge-relay-1-name
    - secretKey: home_bridge_relay_2_name
      remoteRef:
        key: esphome-label-home-bridge-relay-2-name
    - secretKey: inmotion_wheel_mac
      remoteRef:
        key: esphome-inmotion-wheel-mac
    - secretKey: lecteur_cartes_musique_api_key
      remoteRef:
        key: esphome-lecteur-cartes-musique-api-key
    - secretKey: lecteur_cartes_musique_etage_api_key
      remoteRef:
        key: esphome-lecteur-cartes-musique-etage-api-key
    - secretKey: lecteur_cartes_musique_etage_ota_password
      remoteRef:
        key: esphome-lecteur-cartes-musique-etage-ota-password
    - secretKey: lecteur_cartes_musique_ota_password
      remoteRef:
        key: esphome-lecteur-cartes-musique-ota-password
    - secretKey: veilleuse_etoile_api_key
      remoteRef:
        key: esphome-veilleuse-etoile-api-key
    - secretKey: veilleuse_etoile_ota_password
      remoteRef:
        key: esphome-veilleuse-etoile-ota-password
    - secretKey: ventilateur_cluster_k3s_api_key
      remoteRef:
        key: esphome-ventilateur-cluster-k3s-api-key
    - secretKey: ventilateur_cluster_k3s_ota_password
      remoteRef:
        key: esphome-ventilateur-cluster-k3s-ota-password
    - secretKey: wifi_hotspot_fallback_password
      remoteRef:
        key: esphome-wifi-hotspot-fallback-password
    - secretKey: wifi_password
      remoteRef:
        key: esphome-wifi-password
    - secretKey: wifi_ssid
      remoteRef:
        key: esphome-wifi-ssid
