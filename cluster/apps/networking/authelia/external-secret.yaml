---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-secrets
  namespace: networking
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: authelia-secrets
    template:
      type: Opaque
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: authelia-jwt-secret
    - secretKey: SESSION_SECRET
      remoteRef:
        key: authelia-session-secret
    - secretKey: STORAGE_ENCRYPTION_KEY
      remoteRef:
        key: authelia-storage-encryption-key
    - secretKey: users_database.yml
      remoteRef:
        key: authelia-users-database-yml
