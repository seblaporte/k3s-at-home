---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki-stack
  namespace: log-management
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://grafana.github.io/helm-charts
      chart: loki-stack
      version: 2.10.3
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: flux-system
      interval: 1m
  values:
    loki:
      persistence:
        enabled: true
        accessModes:
        - ReadWriteOnce
        size: 5Gi
        storageClassName: "synology-iscsi-storage"
      config:
        auth_enabled: false

        limits_config:
          retention_period: 4320h  # 6 mois

        compactor:
          retention_enabled: true
          compaction_interval: 10m
          working_directory: /data/loki/compactor

        schema_config:
          configs:
            - from: "2020-10-24"
              store: boltdb-shipper
              object_store: s3
              schema: v11
              index:
                prefix: index_
                period: 24h

        storage_config:
          boltdb_shipper:
            shared_store: s3
            active_index_directory: /data/loki/index
            cache_location: /data/loki/cache

          aws:
            s3: s3://${SECRET_LOKI_S3_ACCESS_KEY}:${SECRET_LOKI_S3_SECRET_KEY}@minio.minio.svc.cluster.local:9000/loki
            s3forcepathstyle: true
            insecure: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/master
                operator: NotIn
                values:
                - "true"
      extraArgs:
        log.level: error
    promtail:
      enabled: true
      tolerations:
        - key: "hardware"
          operator: "Exists"
          effect: "NoSchedule"
    # Replaced by the shared Grafana of the monitoring namespace.
    grafana:
      enabled: false
