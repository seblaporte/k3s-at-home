esphome:
  name: lecteur-cartes-musique
  friendly_name: Lecteur cartes musique
  project:
    name: adonno.tag_reader
    version: "1.4"

improv_serial:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Refuse WPA/TKIP: never downgrade below WPA2
  min_auth_mode: WPA2
  # ESP8266 default, pinned: power saving makes the connection drop more often
  power_save_mode: none
  # Reboot if Wi-Fi stays down (only effective without a fallback AP)
  reboot_timeout: 5min

  manual_ip:
    static_ip: 192.168.1.44
    gateway: 192.168.1.1
    subnet: 255.255.255.0

esp8266:
  board: d1_mini

# Enable logging
logger:

substitutions:
  name: tagreader
  friendly_name: TagReader
  
button:
  - platform: restart
    name: "${friendly_name} Restart"
    entity_category: config

# Enable Home Assistant API
api:
  # Reboot if Home Assistant has not been connected for this long
  reboot_timeout: 5min
  encryption:
    key: !secret lecteur_cartes_musique_api_key

# Enable OTA upgrade
ota:
  - platform: esphome
    password: !secret lecteur_cartes_musique_ota_password

i2c:
  scan: False
  # ESP8266 I2C is bit-banged and the PN532 stretches the clock a lot:
  # 400kHz desyncs the bus and leaves the reader stuck
  frequency: 100kHz

globals:
  - id: pn532_bad_checks
    type: int
    initial_value: "0"
  - id: last_tag_ms
    type: uint32_t
    initial_value: "0"
  - id: source
    type: std::string
  - id: url
    type: std::string
  - id: info
    type: std::string

pn532_i2c:
  id: pn532_board
  on_tag:
    then:
    - lambda: 'id(last_tag_ms) = millis();'

    - delay: 0.15s #to fix slow component
        
    - lambda: |-
        id(source)="";
        id(url)="";
        id(info)="";
        if (tag.has_ndef_message()) {
          auto message = tag.get_ndef_message();
          auto records = message->get_records();
          for (auto &record : records) {
            std::string payload = record->get_payload();
            std::string type = record->get_type();
            size_t hass = payload.find("https://www.home-assistant.io/tag/");
            size_t applemusic = payload.find("https://music.apple.com");
            size_t spotify = payload.find("https://open.spotify.com");
            size_t sonos = payload.find("sonos-2://");

            size_t mass_deezer = payload.find("deezer://");
            size_t mass_filesystem_local = payload.find("filesystem_local://");
            size_t mass_filesystem_smb = payload.find("filesystem_smb://");
            size_t mass_plex = payload.find("plex://");
            size_t mass_qobuz = payload.find("qobuz://");
            size_t mass_radiobrowser = payload.find("radiobrowser://");
            size_t mass_soundcloud = payload.find("soundcloud://");
            size_t mass_spotify = payload.find("spotify://");
            size_t mass_tidal = payload.find("tidal://");
            size_t mass_tunein = payload.find("tunein://");
            size_t mass_ytmusic = payload.find("ytmusic://");

            if (type == "U" and hass != std::string::npos ) {
              ESP_LOGD("tagreader", "Found Home Assistant tag NDEF");
              id(source)="hass";
              id(url)=payload;
              id(info)=payload.substr(hass + 34);
            }
            else if (type == "U" and applemusic != std::string::npos ) {
              ESP_LOGD("tagreader", "Found Apple Music tag NDEF");
              id(source)="amusic";
              id(url)=payload;
            }
            else if (type == "U" and spotify != std::string::npos ) {
              ESP_LOGD("tagreader", "Found Spotify tag NDEF");
              id(source)="spotify";
              id(url)=payload;
            }
            else if (type == "U" and sonos != std::string::npos ) {
              ESP_LOGD("tagreader", "Found Sonos app tag NDEF");
              id(source)="sonos";
              id(url)=payload;
            }
            else if (type == "U" && (mass_deezer != std::string::npos ||
                    mass_filesystem_local != std::string::npos ||
                    mass_filesystem_smb != std::string::npos ||
                    mass_plex != std::string::npos ||
                    mass_qobuz != std::string::npos ||
                    mass_radiobrowser != std::string::npos ||
                    mass_soundcloud != std::string::npos ||
                    mass_spotify != std::string::npos ||
                    mass_tidal != std::string::npos ||
                    mass_tunein != std::string::npos ||
                    mass_ytmusic != std::string::npos)) {
              ESP_LOGD("tagreader", "Found Music Assistant tag NDEF");
              id(source) = "mass";
              id(url) = payload;
            }
            else if (type == "T" ) {
              ESP_LOGD("tagreader", "Found music info tag NDEF");
              id(info)=payload;
            }
            else if ( id(source)=="" ) {
              id(source)="uid";
            }
          }
        }
        else {
          id(source)="uid";
        }
    
    - if:
        condition:
          lambda: 'return ( id(source)=="uid" );'
        then:
          - homeassistant.tag_scanned: !lambda |-
              ESP_LOGD("tagreader", "No HA NDEF, using UID");
              return x;
        else:
        - if:
            condition:
              lambda: 'return ( id(source)=="hass" );'
            then:
            - homeassistant.tag_scanned: !lambda 'return id(info);'
            else:
            - homeassistant.event:
                event: esphome.music_tag
                data:
                  reader: !lambda |-
                    return App.get_name().c_str();
                  source: !lambda |-
                    return id(source);
                  url: !lambda |-
                    return id(url);
                  info: !lambda |-
                    return id(info);
    
  on_tag_removed:
    then:
    - homeassistant.event:
        event: esphome.tag_removed

# Reboot when the PN532 is failed (setup error) or its read requests keep
# failing. Only resets the ESP: the PN532 itself stays powered.
interval:
  - interval: 15s
    then:
      - lambda: |-
          if (id(pn532_board)->is_failed() || id(pn532_board)->status_has_warning()) {
            id(pn532_bad_checks) += 1;
            ESP_LOGW("watchdog", "PN532 unhealthy (%d/4)", id(pn532_bad_checks));
            if (id(pn532_bad_checks) >= 4) {
              ESP_LOGE("watchdog", "PN532 unhealthy for 1min, rebooting");
              App.safe_reboot();
            }
          } else {
            id(pn532_bad_checks) = 0;
          }
  # The PN532 can also hang silently: it acks commands but stops detecting
  # tags, without any error. Re-run its init (version + SAM configuration,
  # what fixes it at boot). If it does not answer, it is marked failed and
  # the check above reboots.
  - interval: 10min
    then:
      - lambda: |-
          if (id(pn532_board)->is_failed() || millis() - id(last_tag_ms) < 30000) return;
          ESP_LOGI("watchdog", "Re-initializing PN532");
          id(pn532_board)->setup();

debug:
  update_interval: 60s

binary_sensor:
  - platform: status
    name: "${friendly_name} Status"
    entity_category: diagnostic
  - platform: template
    name: "${friendly_name} NFC Problem"
    device_class: problem
    entity_category: diagnostic
    lambda: |-
      return id(pn532_board)->is_failed() || id(pn532_board)->status_has_warning();

sensor:
  - platform: uptime
    name: "${friendly_name} Uptime"
    entity_category: diagnostic
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: debug
    free:
      name: "${friendly_name} Heap Free"
      entity_category: diagnostic
    block:
      name: "${friendly_name} Heap Max Block"
      entity_category: diagnostic
    fragmentation:
      name: "${friendly_name} Heap Fragmentation"
      entity_category: diagnostic

text_sensor:
  - platform: debug
    reset_reason:
      name: "${friendly_name} Reset Reason"
      entity_category: diagnostic
  - platform: version
    hide_timestamp: true
    name: "${friendly_name} ESPHome Version"
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      icon: mdi:wifi
      entity_category: diagnostic
    ssid:
      name: "${friendly_name} Connected SSID"
      icon: mdi:wifi-strength-2
      entity_category: diagnostic
