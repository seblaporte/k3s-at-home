---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: esphome
  namespace: esphome
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 2.2.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-helm-charts
        namespace: flux-system
      interval: 15m
  values:
    defaultPodOptions:
      priorityClassName: homelab-medium
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: NotIn
                    values:
                      - "true"
    controllers:
      main:
        # Volume RWO : l'ancien pod doit libérer le volume avant que le nouveau démarre
        strategy: Recreate
        containers:
          main:
            image:
              repository: esphome/esphome
              tag: "2026.1.4"
              pullPolicy: IfNotPresent
            env:
              TZ: Europe/Paris
              ESPHOME_DASHBOARD_USE_PING: "true"
            resources:
              requests:
                memory: 250Mi
                cpu: 500m
              limits:
                memory: 2048Mi
                cpu: 4000m
    service:
      main:
        enabled: true
        controller: main
        ports:
          http:
            enabled: true
            port: 6052
            protocol: TCP
    ingress:
      main:
        enabled: true
        ingressClassName: "traefik"
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: networking-forwardauth-authelia@kubernetescrd
          cert-manager.io/cluster-issuer: "letsencrypt-production"
        hosts:
          - host: "esphome.${SECRET_APEX_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: main
        tls:
          - hosts:
              - "esphome.${SECRET_APEX_DOMAIN}"
            secretName: esphome-flat-tls-secret
    persistence:
      config:
        enabled: true
        # Volume créé par l'ancien chart k8s-at-home, conservé avec ses données
        # (helm.sh/resource-policy: keep posé par le commit précédent)
        existingClaim: esphome-config
        globalMounts:
          - path: /config
