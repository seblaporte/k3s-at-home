---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-credentials
  namespace: networking
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: cloudflared-credentials
  data:
    - secretKey: credentials.json
      remoteRef:
        key: cloudflared-credentials-json
