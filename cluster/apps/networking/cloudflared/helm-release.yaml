---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: networking
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 2.2.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-helm-charts
        namespace: flux-system
      interval: 15m
  dependsOn:
    - name: traefik
      namespace: networking
  values:
    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: NotIn
                    values:
                      - "true"
    service:
      main:
        enabled: false
    controllers:
      main:
        replicas: 2
        containers:
          main:
            image:
              repository: cloudflare/cloudflared
              tag: "2026.9.0"
              pullPolicy: IfNotPresent
            args:
              - "tunnel"
              - "--config"
              - "/etc/cloudflared/config.yaml"
              - "--no-autoupdate"
              - "run"
            resources:
              requests:
                memory: 32Mi
                cpu: 25m
              limits:
                memory: 128Mi
                cpu: 200m
    persistence:
      config:
        enabled: true
        type: configMap
        name: cloudflared-config
        globalMounts:
          - path: /etc/cloudflared/config.yaml
            subPath: config.yaml
            readOnly: true
      creds:
        enabled: true
        type: secret
        name: cloudflared-credentials
        globalMounts:
          - path: /etc/cloudflared/creds/credentials.json
            subPath: credentials.json
            readOnly: true
