---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tydom2mqtt
  namespace: tydom2mqtt
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 2.2.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-helm-charts
        namespace: flux-system
      interval: 15m
  valuesFrom:
    - kind: Secret
      name: tydom2mqtt-external-values
      valuesKey: TYDOM_PASSWORD
      targetPath: controllers.main.containers.main.env.TYDOM_PASSWORD
      literal: true
  values:
    defaultPodOptions:
      priorityClassName: homelab-high
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/master
                operator: NotIn
                values:
                - "true"
    controllers:
      main:
        containers:
          main:
            image:
              repository: fmartinou/tydom2mqtt
              tag: "3.5.3"
              pullPolicy: IfNotPresent
            env:
              TZ: Europe/Paris
              TYDOM_MAC: ${SECRET_TYDOM_MAC}
              TYDOM_IP: ${SECRET_TYDOM_IP}
              MQTT_HOST: ${SVC_MOSQUITTO_ADDR}
              MQTT_PORT: "1883"
            resources:
              requests:
                memory: 80Mi
                cpu: 150m
              limits:
                memory: 128Mi
                cpu: 250m
    service:
      main:
        enabled: false
