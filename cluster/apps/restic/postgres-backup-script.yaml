apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-backup-script
  namespace: restic
data:
  entrypoint.sh: |-
    #!/bin/sh
    set -e -o pipefail
    pg_dump --create --clean --if-exists --no-owner --no-privileges $PGDATABASE | \
    gzip --rsyncable | \
    restic backup --host k3s --stdin --stdin-filename databases/$PGDATABASE.sql.gz --tag $PGDATABASE
