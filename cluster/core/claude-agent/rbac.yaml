---
# Identity used by Claude Code sessions (hub repo seblaporte/homelab, MacBook and Mac mini).
# Read access through the built-in "view" role (no Secrets, no exec/port-forward), plus
# reconcile and rollout restart, restricted to annotation-only changes by admission-policy.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-agent
  namespace: kube-system
---
# Long-lived token, revoked by deleting this Secret (the controller fills it).
apiVersion: v1
kind: Secret
metadata:
  name: claude-agent-token
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: claude-agent
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-agent-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: claude-agent
    namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-agent
rules:
  # Cluster-scoped objects not covered by "view"
  - apiGroups: [""]
    resources: [nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  # flux reconcile, ExternalSecret force-sync (annotations only, see admission-policy.yaml)
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [patch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [patch]
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [gitrepositories, helmrepositories, helmcharts, ocirepositories]
    verbs: [patch]
  - apiGroups: [external-secrets.io]
    resources: [externalsecrets]
    verbs: [patch]
  # kubectl rollout restart (restartedAt annotation only, see admission-policy.yaml)
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-agent
subjects:
  - kind: ServiceAccount
    name: claude-agent
    namespace: kube-system
---
# Read active alerts and query Prometheus through the API server service proxy
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-agent-monitoring
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames:
      - kube-prometheus-stack-alertmanager:9093
      - kube-prometheus-stack-prometheus:9090
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-agent-monitoring
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claude-agent-monitoring
subjects:
  - kind: ServiceAccount
    name: claude-agent
    namespace: kube-system
