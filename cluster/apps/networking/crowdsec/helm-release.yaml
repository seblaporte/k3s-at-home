---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: networking
spec:
  interval: 5m
  timeout: 15m
  upgrade:
    cleanupOnFail: true
  chart:
    spec:
      # renovate: registryUrl=https://crowdsecurity.github.io/helm-charts
      chart: crowdsec
      version: 0.24.2
      sourceRef:
        kind: HelmRepository
        name: crowdsec-charts
        namespace: flux-system
      interval: 5m
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  values:
    image:
      repository: crowdsecurity/crowdsec
    container_runtime: containerd
    tls:
      enabled: true
      certManager:
        issuerRef:
          name: crowdsec-ca-issuer-local
          kind: Issuer
    config:
      parsers:
        s02-enrich:
          whitelist-local.yaml: |
            name: crowdsecurity/whitelists-local
            description: "Whitelist for local network"
            whitelist:
              reason: "local IP"
              cidr:
                - "192.168.1.0/24"
                - "${SECRET_HOME_IPV6_PREFIX}"
                - "${SECRET_HOME_IPV4}/32"
          # Apps behind the Authelia forward-auth cannot be brute-forced directly:
          # their 401s are expired sessions (e.g. auto-refreshing dashboards).
          # Authelia's own login (auth.*) is not listed and stays protected.
          whitelist-authelia-401.yaml: |
            name: homelab/whitelist-authelia-401
            description: "Ignore 401s on apps protected by Authelia"
            whitelist:
              reason: "401 on Authelia-protected app"
              expression:
                - >-
                  evt.Meta.http_status == '401' && evt.Meta.target_fqdn in [
                  'esphome.${SECRET_APEX_DOMAIN}',
                  'go2rtc.${SECRET_APEX_DOMAIN}',
                  'grafana.${SECRET_APEX_DOMAIN}',
                  'heimdall.${SECRET_APEX_DOMAIN}',
                  'joal.${SECRET_APEX_DOMAIN}',
                  'kitchenvault.${SECRET_APEX_DOMAIN}',
                  'kitchenvault-dev.${SECRET_APEX_DOMAIN}',
                  'lidarr.${SECRET_APEX_DOMAIN}',
                  'logs.${SECRET_APEX_DOMAIN}',
                  'maintainerr.${SECRET_APEX_DOMAIN}',
                  'minio.${SECRET_APEX_DOMAIN}',
                  'monitoring.${SECRET_APEX_DOMAIN}',
                  'music-assistant.${SECRET_APEX_DOMAIN}',
                  'prowlarr.${SECRET_APEX_DOMAIN}',
                  'radarr.${SECRET_APEX_DOMAIN}',
                  'shopping-cards.${SECRET_APEX_DOMAIN}',
                  'slskd.${SECRET_APEX_DOMAIN}',
                  'sonarr.${SECRET_APEX_DOMAIN}',
                  'tesla-fleet.${SECRET_APEX_DOMAIN}',
                  'teslamate.${SECRET_APEX_DOMAIN}',
                  'teslamate-grafana.${SECRET_APEX_DOMAIN}',
                  'transmission.${SECRET_APEX_DOMAIN}',
                  'uptime-kuma.${SECRET_APEX_DOMAIN}',
                  'yubal.${SECRET_APEX_DOMAIN}',
                  'zigbee2mqtt.${SECRET_APEX_DOMAIN}'
                  ]
    agent:
      priorityClassName: homelab-critical
      daemonsetAnnotations:
        secret.reloader.stakater.com/reload: "crowdsec-agent-tls"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      acquisition:
        - namespace: networking
          podName: traefik-*
          program: traefik
      env:
        - name: PARSERS
          value: "crowdsecurity/cri-logs"
        - name: COLLECTIONS
          value: "crowdsecurity/traefik"
    lapi:
      priorityClassName: homelab-critical
      deployAnnotations:
        secret.reloader.stakater.com/reload: "crowdsec-lapi-tls"
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      dashboard:
        enabled: false
      resources:
        limits:
          memory: 256Mi
          cpu: 500m
        requests:
          cpu: 50m
          memory: 125Mi
      persistentVolume:
        data:
          enabled: true
          storageClassName: "nfs-client"
          size: 1Gi
        config:
          enabled: true
          storageClassName: "nfs-client"
          size: 100Mi
      env:
        - name: ENROLL_KEY
          value: ${SECRET_CROWDSEC_ENROLL_KEY}
        - name: ENROLL_INSTANCE_NAME
          value: "k3s_cluster"
        - name: ENROLL_TAGS
          value: "k3s"
