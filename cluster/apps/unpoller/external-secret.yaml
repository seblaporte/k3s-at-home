---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpoller-external-values
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: unpoller-external-values
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        UP_UNIFI_DEFAULT_PASS: '{{ .unpoller_password }}'
  data:
    - secretKey: unpoller_password
      remoteRef:
        key: unpoller-password
