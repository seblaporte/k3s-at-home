---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-external-values
  namespace: minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: minio-external-values
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        MINIO_ROOT_USER: '{{ .minio_root_user }}'
        MINIO_ROOT_PASSWORD: '{{ .minio_root_password }}'
  data:
    - secretKey: minio_root_password
      remoteRef:
        key: minio-root-password
    - secretKey: minio_root_user
      remoteRef:
        key: minio-root-user
