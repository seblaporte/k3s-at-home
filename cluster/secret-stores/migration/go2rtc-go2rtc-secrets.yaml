---
# One-shot migration to Bitwarden Secrets Manager: see doc/secrets-migration.md
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: migrate-go2rtc-secrets
  namespace: go2rtc
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists # never overwrite a value already in Bitwarden
  deletionPolicy: None # removing this PushSecret keeps the Bitwarden secrets
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: go2rtc-secrets
  data:
    - match:
        secretKey: NVR_USERNAME
        remoteRef:
          remoteKey: go2rtc-nvr-username
    - match:
        secretKey: NVR_PASSWORD
        remoteRef:
          remoteKey: go2rtc-nvr-password
    - match:
        secretKey: GO2RTC_USERNAME
        remoteRef:
          remoteKey: go2rtc-username
    - match:
        secretKey: GO2RTC_PASSWORD
        remoteRef:
          remoteKey: go2rtc-password
