---
# One-shot migration to Bitwarden Secrets Manager: see doc/secrets-migration.md
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: migrate-kitchenvault-secrets
  namespace: kitchenvault-dev
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists # never overwrite a value already in Bitwarden
  deletionPolicy: None # removing this PushSecret keeps the Bitwarden secrets
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: kitchenvault-secrets
  data:
    - match:
        secretKey: postgres-user-password
        remoteRef:
          remoteKey: kitchenvault-dev-postgres-user-password
    - match:
        secretKey: ovh-ai-endpoints-access-token
        remoteRef:
          remoteKey: kitchenvault-dev-ovh-ai-endpoints-access-token
    - match:
        secretKey: COOKIDOO_EMAIL
        remoteRef:
          remoteKey: kitchenvault-dev-cookidoo-email
    - match:
        secretKey: COOKIDOO_PASSWORD
        remoteRef:
          remoteKey: kitchenvault-dev-cookidoo-password
