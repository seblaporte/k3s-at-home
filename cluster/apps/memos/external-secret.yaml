---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memos-external-values
  namespace: memos
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: memos-external-values
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        MEMOS_DSN: 'postgresql://memos:{{ .memos_db_password }}@${NAS_ADDR}:5476/memos?sslmode=disable'
  data:
    - secretKey: memos_db_password
      remoteRef:
        key: memos-db-password
