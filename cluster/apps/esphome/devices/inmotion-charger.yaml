# Passerelle BLE → Home Assistant pour InMotion V10F.
# Composant : components/inmotion_v1 (protocole validé sur la roue, cf. inmotion-connection)
# 1er flash par USB : make flash-usb DEVICE=inmotion-charger PORT=/dev/cu.…

substitutions:
  name: inmotion-charger
  # Adresse MAC de la roue V10F-XXXXXXXX, déduite du System ID (0x2A23) du
  # module TI CC2541. À confirmer dans les logs (ligne « Roue InMotion vue : … »).
  wheel_mac: !secret inmotion_wheel_mac

esphome:
  name: ${name}
  friendly_name: Chargeur gyroroue

esp32:
  # ESP32 classique / « D1 Mini ESP32 » : esp32dev
  # ESP32-C3 Super Mini : variant: esp32c3 + board: esp32-c3-devkitm-1
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: /components

logger:
  level: DEBUG
  logs:
    # Passer à VERBOSE pour voir les trames brutes RX/TX en hexadécimal
    inmotion_v1: DEBUG
    esp32_ble_tracker: INFO

api:
  encryption:
    key: !secret inmotion_charger_api_key

ota:
  - platform: esphome
    password: !secret inmotion_charger_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name} fallback"
    password: !secret wifi_hotspot_fallback_password

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    active: true
  on_ble_advertise:
    - then:
        - lambda: |-
            // Compatible ESPHome 2026.1 (std::string) et ≥ 2026.8 (StringRef, address_str_to)
            #if ESPHOME_VERSION_CODE >= VERSION_CODE(2026, 8, 0)
            std::string n = x.get_name().str();
            char mac_buf[esphome::MAC_ADDRESS_PRETTY_BUFFER_SIZE];
            const char *mac = x.address_str_to(mac_buf);
            #else
            std::string n = x.get_name();
            std::string mac_str = x.address_str();
            const char *mac = mac_str.c_str();
            #endif
            if (n.rfind("V10", 0) == 0 || n.find("InMotion") != std::string::npos)
              ESP_LOGI("inmotion_v1", "Roue InMotion vue : %s  MAC=%s  RSSI=%d dBm",
                       n.c_str(), mac, x.get_rssi());

ble_client:
  - mac_address: ${wheel_mac}
    id: wheel_ble
    auto_connect: true

inmotion_v1:
  ble_client_id: wheel_ble
  password: "000000"
  better_percents: false
  publish_interval: 2s
  voltage:
    name: Tension
    id: wheel_voltage
  battery_level:
    name: Batterie
  current:
    name: Courant
  temperature:
    name: Température
  charging:
    name: En charge
  online:
    name: En ligne

sensor:
  - platform: wifi_signal
    name: Signal Wi-Fi
    update_interval: 60s
  - platform: ble_client
    type: rssi
    ble_client_id: wheel_ble
    name: Signal BLE
    update_interval: 60s
