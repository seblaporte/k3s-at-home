---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: home-assistant-docs
  namespace: home-assistant-docs
spec:
  interval: 60s
  scrapeTimeout: 15s
  module: http_app
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      labels:
        check: web-app
      static:
        - http://home-assistant-docs.home-assistant-docs.svc.cluster.local:8080/
        - http://home-assistant-docs.home-assistant-docs.svc.cluster.local:8081/guide/
