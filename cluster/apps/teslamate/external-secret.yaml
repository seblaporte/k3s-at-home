---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: teslamate-external-values
  namespace: teslamate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: teslamate-external-values
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        DATABASE_PASS: '{{ .teslamate_db_password }}'
        ENCRYPTION_KEY: '{{ .teslamate_encryption_key }}'
  data:
    - secretKey: teslamate_db_password
      remoteRef:
        key: teslamate-db-password
    - secretKey: teslamate_encryption_key
      remoteRef:
        key: teslamate-encryption-key
---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-external-values
  namespace: teslamate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: grafana-external-values
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        DATABASE_PASS: '{{ .teslamate_db_password }}'
  data:
    - secretKey: teslamate_db_password
      remoteRef:
        key: teslamate-db-password
