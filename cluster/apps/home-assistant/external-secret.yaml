---
# secrets.yaml of Home Assistant, mounted read-only at /config/secrets.yaml.
# One Bitwarden secret per value (home-assistant-<key>); the template rebuilds the file.
# Add a secret: create home-assistant-<key> in Bitwarden, then add it to `data` and to the template.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-secrets
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: home-assistant-secrets
    template:
      data:
        # toJson: a JSON string is a valid YAML double-quoted scalar (any character is escaped)
        secrets.yaml: |
          go2rtc_url: {{ .go2rtc_url | toJson }}
          recorder_db_url: {{ .recorder_db_url | toJson }}
          influxdb_token: {{ .influxdb_token | toJson }}
          nvr_username: {{ .nvr_username | toJson }}
          nvr_password: {{ .nvr_password | toJson }}
          google_assistant_private_key: {{ .google_assistant_private_key | toJson }}
          google_assistant_secure_pin: {{ .google_assistant_secure_pin | toJson }}
  data:
    - secretKey: go2rtc_url
      remoteRef:
        key: home-assistant-go2rtc-url
    - secretKey: recorder_db_url
      remoteRef:
        key: home-assistant-recorder-db-url
    - secretKey: influxdb_token
      remoteRef:
        key: home-assistant-influxdb-token
    - secretKey: nvr_username
      remoteRef:
        key: home-assistant-nvr-username
    - secretKey: nvr_password
      remoteRef:
        key: home-assistant-nvr-password
    - secretKey: google_assistant_private_key
      remoteRef:
        key: home-assistant-google-assistant-private-key
    - secretKey: google_assistant_secure_pin
      remoteRef:
        key: home-assistant-google-assistant-secure-pin
---
# Credentials of the git-sync sidecar: read-only deploy key of
# seblaporte/home-assistant-config and a Home Assistant token (check_config, reload_all, notifications)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-git-sync
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: home-assistant-git-sync
  data:
    - secretKey: ssh-key
      remoteRef:
        key: home-assistant-git-deploy-key
    - secretKey: ha-token
      remoteRef:
        key: home-assistant-sync-token
