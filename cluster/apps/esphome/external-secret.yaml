---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: esphome-secrets
  namespace: esphome
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: esphome-secrets
    template:
      type: Opaque
  data:
    - secretKey: secrets.yaml
      remoteRef:
        key: esphome-secrets-yaml
