---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  sourcePVC: uptime-kuma-data
  trigger:
    schedule: "30 2 * * *"
  restic:
    repository: uptime-kuma-volsync-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: synology-snapshotclass
    pruneIntervalDays: 14
    retain:
      daily: 7
      weekly: 4
      monthly: 3
