---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: navidrome-external-values
  namespace: navidrome
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: navidrome-external-values
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        ND_LASTFM_APIKEY: '{{ .navidrome_lastfm_apikey }}'
        ND_LASTFM_SECRET: '{{ .navidrome_lastfm_secret }}'
        ND_SPOTIFY_ID: '{{ .navidrome_spotify_id }}'
        ND_SPOTIFY_SECRET: '{{ .navidrome_spotify_secret }}'
  data:
    - secretKey: navidrome_lastfm_apikey
      remoteRef:
        key: navidrome-lastfm-apikey
    - secretKey: navidrome_lastfm_secret
      remoteRef:
        key: navidrome-lastfm-secret
    - secretKey: navidrome_spotify_id
      remoteRef:
        key: navidrome-spotify-id
    - secretKey: navidrome_spotify_secret
      remoteRef:
        key: navidrome-spotify-secret
