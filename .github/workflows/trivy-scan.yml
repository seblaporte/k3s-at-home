name: Trivy Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "cluster/**/helm-release*.yaml"
      - "cluster/**/helm-release*.yml"

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.diff.outputs.images }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect added or updated images
        id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          images() {
            yq -o=json '.' | jq -r '.. | objects | select(has("repository") and has("tag")) | "\(.repository):\(.tag)"'
          }

          base=$(git merge-base "origin/${BASE_REF}" HEAD)
          : > old.txt
          : > new.txt

          while IFS= read -r file; do
            images < "$file" >> new.txt
            { git show "${base}:${file}" 2>/dev/null || true; } | images >> old.txt
          done < <(git diff --name-only --diff-filter=AM "$base" HEAD | grep -E '^cluster/.*/helm-release[^/]*\.ya?ml$' || true)

          comm -13 <(sort -u old.txt) <(sort -u new.txt) > changed.txt
          comm -23 <(sort -u old.txt) <(sort -u new.txt) > replaced.txt

          # Repository d'une référence (sans tag ni digest)
          repo_of() {
            local ref="${1%%@*}"
            echo "${ref%:*}"
          }

          # Associe chaque nouvelle image à l'ancien tag de la même image (s'il est unique)
          : > pairs.tsv
          while IFS= read -r new; do
            repo=$(repo_of "$new")
            candidates=()
            while IFS= read -r old; do
              if [ "$(repo_of "$old")" = "$repo" ]; then
                candidates+=("$old")
              fi
            done < replaced.txt
            old=""
            if [ "${#candidates[@]}" -eq 1 ]; then
              old="${candidates[0]}"
            fi
            printf '%s\t%s\n' "$new" "$old" >> pairs.tsv
          done < changed.txt

          echo "Images to scan (new <TAB> previous):"
          cat pairs.tsv

          list=$(jq -R -s -c 'split("\n") | map(select(length > 0) | split("\t")) | to_entries | map({id: (.key | tostring), image: .value[0], old: (.value[1] // "")})' < pairs.tsv)
          echo "images=${list}" >> "$GITHUB_OUTPUT"

  scan:
    needs: detect
    if: needs.detect.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.images) }}
    env:
      TRIVY_CACHE_DIR: .trivycache
      # Cluster 100% arm64 : Trivy ne scanne que linux/amd64 par défaut
      TRIVY_PLATFORM: linux/arm64
    steps:
      - name: Cache Trivy DB
        uses: actions/cache@v6
        with:
          path: .trivycache
          key: trivy-cache-${{ runner.os }}
          restore-keys: |
            trivy-cache-

      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: ${{ matrix.image }}
          format: "json"
          output: "result-${{ matrix.id }}.json"
          ignore-unfixed: true
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}
        continue-on-error: true

      - name: Scan previous image ${{ matrix.old }}
        if: matrix.old != ''
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: ${{ matrix.old }}
          format: "json"
          output: "result-${{ matrix.id }}-old.json"
          ignore-unfixed: true
          cache-dir: ${{ env.TRIVY_CACHE_DIR }}
        continue-on-error: true

      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: trivy-result-${{ matrix.id }}
          path: |
            result-${{ matrix.id }}.json
            result-${{ matrix.id }}-old.json
          if-no-files-found: ignore

  report:
    needs: [detect, scan]
    if: ${{ !cancelled() && needs.detect.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Download results
        uses: actions/download-artifact@v8
        with:
          pattern: trivy-result-*
          path: results
          merge-multiple: true
        continue-on-error: true

      - name: Generate Markdown report
        env:
          IMAGES: ${{ needs.detect.outputs.images }}
        run: .github/scripts/trivy-report.sh

      - name: Upsert PR Comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const marker = '<!-- trivy-report -->';
            const finalBody = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: finalBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: finalBody
              });
            }
