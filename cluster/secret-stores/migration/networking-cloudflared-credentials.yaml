---
# One-shot migration to Bitwarden Secrets Manager: see doc/secrets-migration.md
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: migrate-cloudflared-credentials
  namespace: networking
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists # never overwrite a value already in Bitwarden
  deletionPolicy: None # removing this PushSecret keeps the Bitwarden secrets
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: cloudflared-credentials
  data:
    - match:
        secretKey: credentials.json
        remoteRef:
          remoteKey: cloudflared-credentials-json
