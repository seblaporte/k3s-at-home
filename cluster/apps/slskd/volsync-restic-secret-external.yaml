---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slskd-volsync-restic
  namespace: slskd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: slskd-volsync-restic
    template:
      type: Opaque
      data:
        RESTIC_REPOSITORY: '{{ .restic_repository }}volsync/slskd/slskd'
        RESTIC_PASSWORD: '{{ .restic_password }}'
        OS_AUTH_URL: '{{ .restic_os_auth_url }}'
        OS_IDENTITY_API_VERSION: '{{ .restic_os_identity_api_version }}'
        OS_TENANT_ID: '{{ .restic_os_tenant_id }}'
        OS_TENANT_NAME: '{{ .restic_os_tenant_name }}'
        OS_USERNAME: '{{ .restic_os_username }}'
        OS_PASSWORD: '{{ .restic_os_password }}'
        OS_REGION_NAME: '{{ .restic_os_region_name }}'
        OS_USER_DOMAIN_NAME: 'Default'
        OS_PROJECT_DOMAIN_NAME: 'Default'
  data:
    - secretKey: restic_os_auth_url
      remoteRef:
        key: restic-os-auth-url
    - secretKey: restic_os_identity_api_version
      remoteRef:
        key: restic-os-identity-api-version
    - secretKey: restic_os_password
      remoteRef:
        key: restic-os-password
    - secretKey: restic_os_region_name
      remoteRef:
        key: restic-os-region-name
    - secretKey: restic_os_tenant_id
      remoteRef:
        key: restic-os-tenant-id
    - secretKey: restic_os_tenant_name
      remoteRef:
        key: restic-os-tenant-name
    - secretKey: restic_os_username
      remoteRef:
        key: restic-os-username
    - secretKey: restic_password
      remoteRef:
        key: restic-password
    - secretKey: restic_repository
      remoteRef:
        key: restic-repository
