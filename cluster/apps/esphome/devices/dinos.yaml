esphome:
  name: dinos

esp8266:
  board: esp01_1m

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  manual_ip:
    static_ip: 192.168.1.40
    gateway: 192.168.1.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Dino-Lights Fallback Hotspot"
    password: !secret wifi_hotspot_fallback_password

captive_portal:

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret dinos_api_key

ota:
  platform: esphome
  password: !secret dinos_ota_password

light:
  - platform: partition
    name: "Dino 1"
    segments:
      - id: WS2812_strip
        from: 0
        to: 15
    effects:
      - random:
      - addressable_rainbow:
      - addressable_color_wipe:
      - addressable_scan:
      - addressable_twinkle:
      - addressable_random_twinkle:

  - platform: partition
    name: "Dino 2"
    segments:
      - id: WS2812_strip
        from: 16
        to: 28
    effects:
      - random:
      - addressable_rainbow:
      - addressable_color_wipe:
      - addressable_scan:
      - addressable_twinkle:
      - addressable_random_twinkle:
        
  - platform: neopixelbus
    num_leds: 29
    type: GRB
    variant: WS2812
    pin: GPIO3
    id: WS2812_strip
    internal: true
