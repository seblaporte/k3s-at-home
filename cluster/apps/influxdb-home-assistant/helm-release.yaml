---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: influxdb-home-assistant
  namespace: influxdb-home-assistant
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://helm.influxdata.com/
      chart: influxdb2
      version: 2.1.2
      sourceRef:
        kind: HelmRepository
        name: influxdata-charts
        namespace: flux-system
      interval: 5m
  valuesFrom:
    - kind: Secret
      name: influxdb-home-assistant-external-values
      valuesKey: password
      targetPath: adminUser.password
      literal: true
  values:
    priorityClassName: homelab-medium
    persistence:
      enabled: true
      storageClass: "synology-iscsi-storage"
      accessMode: ReadWriteOnce
      size: 20Gi
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: node-role.kubernetes.io/master
              operator: NotIn
              values:
              - "true"
    resources:
      requests:
        memory: 512Mi
        cpu: 500m
      limits:
        memory: 1024Mi
        cpu: 1000m
    service:
      type: LoadBalancer
      spec:
        loadBalancerIP: "${SVC_INFLUXDB_HOME_ASSISTANT_ADDR}"
        externalTrafficPolicy: Local
    adminUser:
      password: "set by valuesFrom influxdb-home-assistant-external-values/password"
    initScripts:
      enabled: true
      scripts:
        init.iql: |+
          CREATE DATABASE home_assistant
