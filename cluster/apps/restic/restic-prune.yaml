---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-prune
  namespace: restic
spec:
  schedule: "0 4 * * 6" # Tous les samedi à 04h00 UTC
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          containers:
            - name: restic-prune
              image: ghcr.io/seblaporte/restic:1.2.0
              imagePullPolicy: IfNotPresent
              env:
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: restic_password
                - name: RESTIC_REPOSITORY
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: restic_repository
                - name: OS_AUTH_URL
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: restic_os_auth_url
                - name: OS_IDENTITY_API_VERSION
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: restic_os_identity_api_version
                - name: OS_TENANT_ID
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: restic_os_tenant_id
                - name: OS_TENANT_NAME
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: restic_os_tenant_name
                - name: OS_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: restic_os_username
                - name: OS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: restic_os_password
                - name: OS_REGION_NAME
                  valueFrom:
                    secretKeyRef:
                      name: restic-credentials
                      key: restic_os_region_name
                - name: OS_USER_DOMAIN_NAME
                  value: "Default"
                - name: OS_PROJECT_DOMAIN_NAME
                  value: "Default"
              command: ["/bin/entrypoint.sh"]
              volumeMounts:
                - name: script
                  mountPath: /bin/entrypoint.sh
                  readOnly: true
                  subPath: entrypoint.sh
          volumes:
            - name: script
              configMap:
                defaultMode: 0700
                name: prune-script
          restartPolicy: OnFailure
