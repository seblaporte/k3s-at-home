---
# Documentation of Home Assistant (docs/ of seblaporte/home-assistant-config), built by its CI and
# published on its `site` branch. git-sync pulls that branch, nginx serves the two builds:
#   docs-ha     → admin/ (specs, admins only)
#   docs-maison → guide/ (household guide, admins only for now)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant-docs
  namespace: home-assistant-docs
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 2.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-helm-charts
        namespace: flux-system
      interval: 15m
  values:
    defaultPodOptions:
      securityContext:
        # git-sync (65533) writes the checkout, nginx (101) reads it; fsGroup lets git-sync read its key
        fsGroup: 65533
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: NotIn
                    values:
                      - "true"
    controllers:
      main:
        containers:
          main:
            image:
              repository: nginxinc/nginx-unprivileged
              tag: "1.29-alpine"
              pullPolicy: IfNotPresent
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 10
          git-sync:
            image:
              repository: registry.k8s.io/git-sync/git-sync
              tag: v4.8.0
              pullPolicy: IfNotPresent
            args:
              - --repo=git@github.com:seblaporte/home-assistant-config.git
              - --ref=site
              - --root=/git
              - --link=current
              - --period=60s
              - --depth=1
              - --max-failures=-1
              - --ssh-key-file=/etc/git-secret/ssh-key
              - --ssh-known-hosts=true
              - --ssh-known-hosts-file=/etc/git-config/known_hosts
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      main:
        enabled: true
        controller: main
        type: ClusterIP
        ports:
          http:
            enabled: true
            port: 8080
            protocol: HTTP
          guide:
            enabled: true
            port: 8081
            protocol: HTTP
    ingress:
      admin:
        enabled: true
        ingressClassName: "traefik"
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: networking-forwardauth-authelia@kubernetescrd
          cert-manager.io/cluster-issuer: "letsencrypt-production"
        hosts:
          - host: "docs-ha.${SECRET_APEX_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: main
                  port: 8080
        tls:
          - hosts:
              - "docs-ha.${SECRET_APEX_DOMAIN}"
            secretName: docs-ha-flat-tls-secret
      guide:
        enabled: true
        ingressClassName: "traefik"
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: networking-forwardauth-authelia@kubernetescrd
          cert-manager.io/cluster-issuer: "letsencrypt-production"
        hosts:
          - host: "docs-maison.${SECRET_APEX_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: main
                  port: 8081
        tls:
          - hosts:
              - "docs-maison.${SECRET_APEX_DOMAIN}"
            secretName: docs-maison-flat-tls-secret
    persistence:
      site:
        enabled: true
        type: emptyDir
        advancedMounts:
          main:
            main:
              - path: /git
                readOnly: true
            git-sync:
              - path: /git
      config:
        enabled: true
        type: configMap
        name: home-assistant-docs-config
        advancedMounts:
          main:
            main:
              - path: /etc/nginx/conf.d/default.conf
                subPath: nginx.conf
            git-sync:
              - path: /etc/git-config/known_hosts
                subPath: known_hosts
      git-secret:
        enabled: true
        type: secret
        name: home-assistant-docs-git-sync
        defaultMode: 288 # 0440: readable by the fsGroup
        advancedMounts:
          main:
            git-sync:
              - path: /etc/git-secret
