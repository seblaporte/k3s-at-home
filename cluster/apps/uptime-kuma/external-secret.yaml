---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uptime-kuma-external-values
  namespace: uptime-kuma
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: uptime-kuma-external-values
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        ADMIN_EMAIL: '{{ .uptime_kuma_admin_email }}'
        ADMIN_PASSWORD: '{{ .uptime_kuma_admin_password }}'
  data:
    - secretKey: uptime_kuma_admin_email
      remoteRef:
        key: uptime-kuma-admin-email
    - secretKey: uptime_kuma_admin_password
      remoteRef:
        key: uptime-kuma-admin-password
