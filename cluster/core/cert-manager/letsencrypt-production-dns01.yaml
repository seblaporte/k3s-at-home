---
# Issuer DNS-01 (Cloudflare) pour les certificats que HTTP-01 ne peut pas valider :
# l'auto-vérification de cert-manager passe par l'IP publique et la box rejette le hairpin NAT (403).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production-dns01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "${SECRET_CLOUDFLARE_EMAIL}"
    preferredChain: "ISRG Root X1"
    privateKeySecretRef:
      name: letsencrypt-production-dns01
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-token-secret
              key: cloudflare-token
