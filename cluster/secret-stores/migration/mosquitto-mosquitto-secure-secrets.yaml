---
# One-shot migration to Bitwarden Secrets Manager: see doc/secrets-migration.md
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: migrate-mosquitto-secure-secrets
  namespace: mosquitto
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists # never overwrite a value already in Bitwarden
  deletionPolicy: None # removing this PushSecret keeps the Bitwarden secrets
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: mosquitto-secure-secrets
  data:
    - match:
        secretKey: MQTT_USERNAME
        remoteRef:
          remoteKey: mosquitto-mqtt-username
    - match:
        secretKey: MQTT_PASSWORD
        remoteRef:
          remoteKey: mosquitto-mqtt-password
