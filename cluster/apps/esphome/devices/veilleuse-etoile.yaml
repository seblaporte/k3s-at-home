esphome:
  name: veilleuse-etoile
  friendly_name: Veilleuse Étoile

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret veilleuse_etoile_api_key

ota:
  platform: esphome
  password: !secret veilleuse_etoile_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  manual_ip:
    static_ip: 192.168.1.43
    gateway: 192.168.1.1
    subnet: 255.255.255.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Veilleuse-Etoile Fallback"
    password: !secret wifi_hotspot_fallback_password

captive_portal:

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

light:
  - platform: partition
    name: "Etoile"
    segments:
      - id: WS2812_strip
        from: 0
        to: 21
    effects:
      - random:
      - addressable_rainbow:
      - addressable_color_wipe:
      - addressable_scan:
      - addressable_twinkle:
      - addressable_random_twinkle:
        
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    rgb_order: GRB
    num_leds: 22
    pin: GPIO16
    id: WS2812_strip
    internal: true
