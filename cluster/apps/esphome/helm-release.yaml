---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: esphome
  namespace: esphome
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 2.2.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-helm-charts
        namespace: flux-system
      interval: 15m
  values:
    defaultPodOptions:
      priorityClassName: homelab-medium
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: NotIn
                    values:
                      - "true"
    controllers:
      main:
        # Volume RWO : l'ancien pod doit libérer le volume avant que le nouveau démarre
        strategy: Recreate
        containers:
          main:
            image:
              repository: esphome/esphome
              tag: "2026.10.2"
              pullPolicy: IfNotPresent
            env:
              TZ: Europe/Paris
              ESPHOME_DASHBOARD_USE_PING: "true"
              ESPHOME_DATA_DIR: /data
            resources:
              requests:
                memory: 250Mi
                cpu: 500m
              limits:
                memory: 2048Mi
                cpu: 4000m
    service:
      main:
        enabled: true
        controller: main
        ports:
          http:
            enabled: true
            port: 6052
            protocol: TCP
    ingress:
      main:
        enabled: true
        ingressClassName: "traefik"
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
          traefik.ingress.kubernetes.io/router.middlewares: networking-forwardauth-authelia@kubernetescrd
          cert-manager.io/cluster-issuer: "letsencrypt-production"
        hosts:
          - host: "esphome.${SECRET_APEX_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  name: main
        tls:
          - hosts:
              - "esphome.${SECRET_APEX_DOMAIN}"
            secretName: esphome-flat-tls-secret
    persistence:
      # Config issue de Git : ConfigMap esphome-devices + Secret esphome-secrets (secrets.yaml),
      # fusionnés dans un volume projeté, mis à jour par le kubelet sans redémarrage du pod
      config:
        enabled: true
        type: custom
        volumeSpec:
          projected:
            sources:
              - configMap:
                  name: esphome-devices
              - secret:
                  name: esphome-secrets
        globalMounts:
          - path: /config
            readOnly: true
      component-inmotion-v1:
        enabled: true
        type: configMap
        name: esphome-component-inmotion-v1
        globalMounts:
          - path: /components/inmotion_v1
            readOnly: true
      component-daikin-x10a:
        enabled: true
        type: configMap
        name: esphome-component-daikin-x10a
        globalMounts:
          - path: /components/daikin_x10a
            readOnly: true
      # Volume créé par l'ancien chart k8s-at-home, conservé avec ses données : builds et
      # toolchains PlatformIO. L'ancienne config reste à sa racine (retour arrière possible).
      data:
        enabled: true
        existingClaim: esphome-config
        globalMounts:
          - path: /data
            subPath: data
          - path: /cache
            subPath: cache
