---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: influxdb-home-assistant-external-values
  namespace: influxdb-home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: influxdb-home-assistant-external-values
    template:
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
      data:
        password: '{{ .default_user_influx_db_password }}'
  data:
    - secretKey: default_user_influx_db_password
      remoteRef:
        key: default-user-influx-db-password
