---
# One-shot migration to Bitwarden Secrets Manager: see doc/secrets-migration.md
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: migrate-authelia-secrets
  namespace: networking
spec:
  refreshInterval: 1h
  updatePolicy: IfNotExists # never overwrite a value already in Bitwarden
  deletionPolicy: None # removing this PushSecret keeps the Bitwarden secrets
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: bitwarden
  selector:
    secret:
      name: authelia-secrets
  data:
    - match:
        secretKey: JWT_SECRET
        remoteRef:
          remoteKey: authelia-jwt-secret
    - match:
        secretKey: SESSION_SECRET
        remoteRef:
          remoteKey: authelia-session-secret
    - match:
        secretKey: STORAGE_ENCRYPTION_KEY
        remoteRef:
          remoteKey: authelia-storage-encryption-key
    - match:
        secretKey: users_database.yml
        remoteRef:
          remoteKey: authelia-users-database-yml
