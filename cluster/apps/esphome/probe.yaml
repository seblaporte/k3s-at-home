---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: esphome
  namespace: esphome
spec:
  interval: 60s
  scrapeTimeout: 15s
  module: http_app
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      labels:
        check: web-app
      static:
        - http://esphome.esphome.svc.cluster.local:6052/
