---
# Values from Bitwarden Secrets Manager (see doc/secrets-migration.md)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spotdl-external-env
  namespace: spotdl
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: spotdl-external-env
  data:
    - secretKey: OPENVPN_USER
      remoteRef:
        key: vpn-username
    - secretKey: OPENVPN_PASSWORD
      remoteRef:
        key: vpn-password
