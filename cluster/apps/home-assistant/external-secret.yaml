---
# secrets.yaml of Home Assistant, mounted read-only at /config/secrets.yaml
# (Bitwarden secret home-assistant-secrets-yaml, the whole file)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-secrets
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: home-assistant-secrets
  data:
    - secretKey: secrets.yaml
      remoteRef:
        key: home-assistant-secrets-yaml
---
# Credentials of the git-sync sidecar: read-only deploy key of
# seblaporte/home-assistant-config and a Home Assistant token (check_config, reload_all, notifications)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-git-sync
  namespace: home-assistant
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden
  target:
    name: home-assistant-git-sync
  data:
    - secretKey: ssh-key
      remoteRef:
        key: home-assistant-git-deploy-key
    - secretKey: ha-token
      remoteRef:
        key: home-assistant-sync-token
