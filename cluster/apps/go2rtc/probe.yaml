---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: go2rtc
  namespace: go2rtc
spec:
  interval: 60s
  scrapeTimeout: 15s
  module: http_app
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      labels:
        check: web-app
      static:
        - http://go2rtc.go2rtc.svc.cluster.local:1984/
