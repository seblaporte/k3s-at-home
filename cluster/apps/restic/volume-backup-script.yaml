apiVersion: v1
kind: ConfigMap
metadata:
  name: volume-backup-script
  namespace: restic
data:
  entrypoint.sh: |-
    #!/bin/sh
    # Keep going after a failure so one broken app does not skip the others, then fail the job.
    rc=0
    restic --host k3s --tag vaultwarden             backup /k3s/vaultwarden* || rc=1
    restic --host k3s --tag teslamate               backup /k3s/teslamate* || rc=1
    restic --host k3s --tag crowdsec                backup /k3s/networking-crowdsec* || rc=1
    restic --host k3s --tag mosquitto               backup /k3s/mosquitto* || rc=1
    restic --host k3s --tag home-assistant          backup /k3s/home-assistant-home-assistant-data* || rc=1
    restic --host k3s --tag heimdall                backup /k3s/heimdall* || rc=1
    restic --host k3s --tag esphome                 backup /k3s/esphome* || rc=1
    restic --host k3s --tag adguard-home            backup /k3s/adguard-home* || rc=1
    restic --host k3s --tag sonarr                  backup /k3s/sonarr* || rc=1
    restic --host k3s --tag radarr                  backup /k3s/radarr* || rc=1
    restic --host k3s --tag prowlarr                backup /k3s/prowlarr* || rc=1
    restic --host k3s --tag joal                    backup /k3s/joal* || rc=1
    restic --host k3s --tag transmission            backup /k3s/transmission* || rc=1
    restic --host k3s --tag jellyfin                backup /k3s/jellyfin-jellyfin-config* || rc=1
    restic --host k3s --tag jellyseerr              backup /k3s/jellyseerr* || rc=1
    restic --host k3s --tag airconnect              backup /k3s/airconnect* || rc=1
    restic --host k3s --tag lidarr                  backup /k3s/lidarr* || rc=1
    restic --host k3s --tag authelia                backup /k3s/networking-authelia-config* || rc=1
    restic --host k3s --tag scrypted                backup /k3s/scrypted* || rc=1
    exit $rc
