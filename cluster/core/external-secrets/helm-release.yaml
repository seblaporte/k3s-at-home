---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://charts.external-secrets.io
      chart: external-secrets
      version: 2.15.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets-charts
        namespace: flux-system
      interval: 15m
  values:
    # CRDs are installed by the `crds` layer (cluster/crds/external-secrets)
    installCRDs: false
    global:
      affinity: &affinity
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/master
                    operator: NotIn
                    values:
                      - "true"
    priorityClassName: homelab-critical
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    certController:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    # Wrapper around the Bitwarden Rust SDK, queried by the bitwardensecretsmanager provider.
    # It must serve HTTPS: its certificate comes from tls.yaml (secret bitwarden-tls-certs).
    bitwarden-sdk-server:
      enabled: true
      affinity: *affinity
      deploymentAnnotations:
        secret.reloader.stakater.com/reload: bitwarden-tls-certs
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
