---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teleinfo2mqtt
  namespace: teleinfo2mqtt
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 2.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-helm-charts
        namespace: flux-system
      interval: 15m
  values:
    defaultPodOptions:
      priorityClassName: homelab-medium
      nodeSelector:
        nodetype: hardware-gateway
      tolerations:
        - key: "hardware"
          operator: "Exists"
          effect: "NoSchedule"
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/seblaporte/teleinfo2mqtt
              tag: latest@sha256:efdfa9f9d6827b73479f3301253cfb6f6b73c86c6f830439285f2a5c230cb1d4
              pullPolicy: IfNotPresent
            resources:
              requests:
                memory: 96Mi
                cpu: 25m
              limits:
                memory: 128Mi
                cpu: 200m
            securityContext:
              # Privileged securityContext required by USB devices accessed directly through the host machine
              privileged: true
    persistence:
      arduino:
        enabled: true
        type: hostPath
        hostPath: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
        globalMounts:
          - path: /dev/ttyUSB0
    service:
      main:
        enabled: false
