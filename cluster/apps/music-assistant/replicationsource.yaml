---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: music-assistant
  namespace: music-assistant
spec:
  sourcePVC: music-assistant-data
  trigger:
    schedule: "45 2 * * *"
  restic:
    repository: music-assistant-volsync-restic
    copyMethod: Snapshot
    volumeSnapshotClassName: synology-snapshotclass
    pruneIntervalDays: 14
    retain:
      daily: 7
      weekly: 4
      monthly: 3
